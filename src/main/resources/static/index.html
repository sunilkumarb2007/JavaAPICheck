<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexPay - Secure Checkout</title>
    <meta name="description" content="A premium secure checkout experience">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="background-elements">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>

    <main class="checkout-container">
        <div class="card-header">
            <h1>NexPay</h1>
            <p>Complete your transaction securely</p>
        </div>

        <form id="paymentForm" class="payment-form">
            <div class="input-group">
                <label for="merchantCode">Merchant Code</label>
                <!-- Pre-filled with an unknown merchant to trigger the NPE bug in the backend -->
                <input type="text" id="merchantCode" name="merchantCode" value="UNKNOWN_MERCHANT" readonly>
            </div>

            <div class="input-group">
                <label for="amount">Amount (USD)</label>
                <div class="amount-wrapper">
                    <span class="currency-symbol">$</span>
                    <input type="number" id="amount" name="amount" value="50.00" readonly>
                </div>
            </div>

            <div class="order-summary">
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span>$50.00</span>
                </div>
                <div class="summary-row">
                    <span>Processing Fee</span>
                    <span>$0.00</span>
                </div>
                <div class="summary-row total">
                    <span>Total</span>
                    <span>$50.00</span>
                </div>
            </div>

            <button type="submit" id="payButton" class="btn-primary">
                <span class="btn-text">Pay $50.00</span>
                <span class="loader hidden"></span>
            </button>
        </form>
    </main>

    <!-- Error Toast Notification -->
    <div id="errorToast" class="toast hidden">
        <div class="toast-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
        </div>
        <div class="toast-content">
            <h4>System Error (HTTP 500)</h4>
            <p>An unexpected error occurred while processing your payment. Our engineering team has been notified.</p>
        </div>
        <button id="closeToast" class="close-btn">&times;</button>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
